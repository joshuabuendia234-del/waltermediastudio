<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walter Media Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      width: clamp(350px, 60vw, 750px);
      height: clamp(350px, 60vw, 750px);
      background: radial-gradient(circle, rgba(212, 175, 55, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 900px;
      width: 100%;
    }

    .logo-siglas {
      font-family: 'Cinzel', serif;
      font-size: clamp(4.5rem, 16vw, 11rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      line-height: 1;
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.35));
      user-select: none;
      margin-bottom: 1.2rem;
      padding-left: 0.12em;
    }

    .divider {
      width: 140px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      margin: 0 auto 1.6rem auto;
    }

    .subtitulo {
      font-family: 'Cinzel', serif;
      font-size: clamp(1rem, 3vw, 1.8rem);
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa771c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.25));
      user-select: none;
    }

    /* BOTÓN MONEDA CON EFECTO DE LEVITACIÓN Y BRILLO */
    .boton-moneda {
      display: inline-block;
      margin-top: 2.5rem;
      cursor: pointer;
      text-decoration: none;
      outline: none;
      animation: flotar 4s ease-in-out infinite;
      perspective: 1000px;
    }

    .boton-moneda img {
      width: clamp(120px, 20vw, 170px);
      height: auto;
      display: block;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
    }

    .boton-moneda:hover img {
      transform: scale(1.1) rotate(5deg);
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 30px rgba(243, 229, 171, 0.9));
    }

    .boton-moneda:active img {
      transform: scale(0.95);
    }

    @keyframes flotar {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .footer {
      position: absolute;
      bottom: 1.5rem;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      color: #aa771c;
      opacity: 0.7;
      z-index: 2;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1 class="logo-siglas">WMS</h1>
    <div class="divider"></div>
    <p class="subtitulo">Walter Media Studio</p>

    <a href="#contacto" class="boton-moneda" aria-label="Ingresar a Walter Media Studio">
      <img src="Gemini_Generated_Image_51vo9551vo9551vo-removebg-preview.png" alt="Acceso Walter Media Studio">
    </a>
  </main>

  <footer class="footer">
    &copy; 2026 WALTER MEDIA STUDIO
  </footer>

</body>
</html>
