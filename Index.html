<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walter Media Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      max-width: 900px;
      width: 100%;
    }

    .logo-siglas {
      font-family: 'Cinzel', serif;
      font-size: clamp(5rem, 18vw, 12rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      line-height: 1;
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 35px rgba(212, 175, 55, 0.4));
      user-select: none;
      margin-bottom: 1.5rem;
      padding-left: 0.12em;
    }

    .divider {
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      margin: 0 auto 1.8rem auto;
    }

    .subtitulo {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.2rem, 3.5vw, 2.2rem);
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa771c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
      user-select: none;
    }

    .footer {
      position: absolute;
      bottom: 1.5rem;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      color: #aa771c;
      opacity: 0.7;
      z-index: 2;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1 class="logo-siglas">WMS</h1>
    <div class="divider"></div>
    <p class="subtitulo">Walter Media Studio</p>
  </main>

  <footer class="footer">
    &copy; 2026 WALTER MEDIA STUDIO
  </footer>

</body>
</html>
